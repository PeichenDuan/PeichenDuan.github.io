<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>模拟突变工具 - 生物信息分析工具包</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --accent-color: #e74c3c;
            --light-color: #ecf0f1;
            --dark-color: #2c3e50;
            --success-color: #27ae60;
            --warning-color: #f39c12;
            --border-radius: 8px;
            --box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: "Microsoft YaHei", "微软雅黑", sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
        }

        .tool-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: var(--primary-color);
            color: white;
            padding: 20px;
            width: 100%;
            text-align: center;
        }

        .back-button {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: var(--border-radius);
            cursor: pointer;
            transition: var(--transition);
            font-size: 0.9rem;
            margin-top: 15px;
            text-decoration: none;
            display: inline-block;
        }
        .back-button:hover { background: rgba(255,255,255,0.3); }

        .main-content {
            display: flex;
            min-height: calc(100vh - 60px);
        }

        .left-panel {
            flex: 3;
            padding: 20px;
            border-right: 1px solid #ddd;
        }

        .right-panel {
            flex: 1;
            padding: 20px;
            background-color: #f9f9f9;
        }

        .section { margin-bottom: 20px; }

        .section-title-small {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            padding-bottom: 5px;
            border-bottom: 2px solid var(--primary-color);
        }

        .form-group { margin-bottom: 15px; }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        select, input, textarea, button {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: var(--border-radius);
            font-size: 14px;
        }

        select { background-color: white; }

        button {
            background-color: var(--secondary-color);
            color: white;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover { background-color: #2980b9; }

        button.delete-btn {
            background-color: var(--accent-color);
            width: auto;
            padding: 5px 10px;
            flex-shrink: 0;
        }
        button.delete-btn:hover { background-color: #c0392b; }

        button.small-btn {
            width: auto;
            padding: 6px 14px;
            font-size: 13px;
        }

        /* Tabs for sequence input */
        .tabs {
            display: flex;
            border-bottom: 2px solid #ddd;
            margin-bottom: 12px;
        }
        .tab-btn {
            flex: none;
            width: auto;
            padding: 8px 20px;
            background: #eee;
            border: none;
            border-radius: var(--border-radius) var(--border-radius) 0 0;
            cursor: pointer;
            font-size: 14px;
            color: #666;
            margin-right: 4px;
            transition: var(--transition);
        }
        .tab-btn.active {
            background: var(--secondary-color);
            color: white;
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .gene-list {
            height: 200px;
            overflow-y: auto;
            border: 1px solid #ddd;
            border-radius: var(--border-radius);
            padding: 5px;
        }

        .gene-item {
            padding: 8px;
            cursor: pointer;
            border-bottom: 1px solid #eee;
        }
        .gene-item:hover { background-color: #f0f0f0; }
        .gene-item.selected {
            background-color: var(--secondary-color);
            color: white;
        }

        /* Mutation mode toggle */
        .mode-toggle {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }
        .mode-option {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: var(--border-radius);
            cursor: pointer;
            transition: var(--transition);
            font-weight: bold;
            font-size: 14px;
            user-select: none;
        }
        .mode-option:hover { border-color: var(--secondary-color); }
        .mode-option.active {
            border-color: var(--secondary-color);
            background: #eaf4fd;
            color: var(--secondary-color);
        }
        .mode-option input { display: none; }
        .mode-hint {
            font-size: 12px;
            color: #888;
            font-weight: normal;
            display: block;
        }

        /* Batch textarea */
        .batch-textarea {
            width: 100%;
            min-height: 100px;
            font-family: "Consolas", "Courier New", monospace;
            font-size: 13px;
            line-height: 1.5;
            resize: vertical;
        }

        .mutant-container {
            max-height: 220px;
            overflow-y: auto;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: var(--border-radius);
            padding: 10px;
            background: #fafafa;
        }

        .mutant-input {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            gap: 8px;
        }
        .mutant-input input {
            flex: 1;
            min-width: 0;
        }
        .mutant-input .mutant-type-badge {
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 12px;
            font-weight: bold;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .badge-single {
            background: #e8f5e9;
            color: #2e7d32;
        }
        .badge-combo {
            background: #fff3e0;
            color: #e65100;
        }

        .batch-actions {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }
        .batch-actions button {
            flex: 1;
            width: auto;
        }
        .btn-parse {
            background-color: var(--success-color);
        }
        .btn-parse:hover { background-color: #219653; }
        .btn-clear {
            background-color: #95a5a6;
        }
        .btn-clear:hover { background-color: #7f8c8d; }

        .output-options {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }
        .output-option {
            display: flex;
            align-items: center;
        }
        .output-option input {
            width: auto;
            margin-right: 5px;
        }

        .export-btn {
            background-color: var(--success-color);
            padding: 10px;
            font-weight: bold;
        }
        .export-btn:hover { background-color: #219653; }

        .mutation-count {
            font-size: 13px;
            color: #666;
            text-align: center;
            margin-bottom: 8px;
        }
        .mutation-count strong { color: var(--secondary-color); }

        .info-box {
            height: 715px;
            overflow-y: auto;
            border: 1px solid #ddd;
            border-radius: var(--border-radius);
            padding: 10px;
            background-color: white;
            font-family: monospace;
            font-size: 14px;
        }

        .log-entry {
            margin-bottom: 5px;
            padding-bottom: 5px;
            border-bottom: 1px solid #eee;
        }

        .status-bar {
            padding: 10px;
            background-color: #f0f0f0;
            text-align: center;
            font-weight: bold;
            width: 100%;
        }

        @media (max-width: 768px) {
            .main-content { flex-direction: column; }
            .left-panel, .right-panel { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="tool-header">
        <h2>模拟突变工具</h2>
        <a href="index.html" class="back-button">返回主界面</a>
    </div>

    <div class="main-content">
        <div class="left-panel">
            <!-- Section 1: Sequence Input -->
            <div class="section">
                <div class="section-title-small">序列输入</div>
                <div class="tabs">
                    <button class="tab-btn active" data-tab="tab-paste">📋 粘贴文本</button>
                    <button class="tab-btn" data-tab="tab-upload">📁 上传文件</button>
                </div>

                <div id="tab-paste" class="tab-content active">
                    <div class="form-group">
                        <label for="seq-name">序列名称：</label>
                        <input type="text" id="seq-name" value="WT" placeholder="默认为 WT（野生型），可自定义命名">
                    </div>
                    <div class="form-group">
                        <label for="seq-textarea">粘贴序列（支持 FASTA 格式或纯氨基酸序列，自动识别）：</label>
                        <textarea id="seq-textarea" class="batch-textarea" placeholder="可粘贴任意格式：&#10;1. FASTA格式：>GeneName&#10;MSEERLQ...&#10;2. 纯序列文本：MSEERLQ...&#10;3. 带数字的序列：1 MSE 2 ERL 3 Q...（自动清洗）"></textarea>
                    </div>
                    <button id="btn-parse-seq" class="small-btn" style="background-color:var(--success-color);">解析序列 →</button>
                </div>

                <div id="tab-upload" class="tab-content">
                    <div class="form-group">
                        <label for="fasta-file">选择文件（支持 .fasta / .fa / .txt / 任意文本文件，自动识别格式）：</label>
                        <input type="file" id="fasta-file" accept=".fasta,.fa,.fna,.txt,.seq,.text" multiple>
                    </div>
                    <p style="font-size:12px;color:#888;">支持任意文本格式：FASTA、纯序列、带编号的序列等。数字和空格会自动清洗。</p>
                </div>
            </div>

            <!-- Section 2: Gene Selection -->
            <div class="section">
                <div class="section-title-small">基因选择</div>
                <div class="form-group">
                    <label for="gene-list">已加载的基因（点击选择）：</label>
                    <div id="gene-list" class="gene-list">
                        <div class="gene-item">请先粘贴序列或上传文件</div>
                    </div>
                </div>
            </div>

            <!-- Section 3: Mutation Settings -->
            <div class="section">
                <div class="section-title-small">突变设置</div>

                <!-- Mode toggle -->
                <div class="form-group">
                    <label>突变模式：</label>
                    <div class="mode-toggle">
                        <label class="mode-option active" id="mode-single">
                            <input type="radio" name="mutation-mode" value="single" checked>
                            🔬 单点突变
                            <span class="mode-hint">每个突变独立生成一条序列</span>
                        </label>
                        <label class="mode-option" id="mode-combo">
                            <input type="radio" name="mutation-mode" value="combo">
                            🧬 组合突变
                            <span class="mode-hint">一组突变同时作用于一条序列</span>
                        </label>
                    </div>
                </div>

                <!-- Batch paste area -->
                <div class="form-group">
                    <label for="batch-mutations">批量输入突变（粘贴后点击"解析"）：</label>
                    <textarea id="batch-mutations" class="batch-textarea" placeholder="单点突变模式：所有突变用空格/换行分隔，每个独立生成&#10;例如：G514N G514S D518W D518P I519E I519P&#10;&#10;组合突变模式：每行一组，行内空格分隔的突变同时作用&#10;例如：G514N D518W&#10;     I519E Y520T"></textarea>
                    <div class="batch-actions">
                        <button id="btn-parse-mutations" class="btn-parse small-btn">🔍 批量解析</button>
                        <button id="btn-clear-mutations" class="btn-clear small-btn">清空列表</button>
                        <button id="add-mutant-btn" class="small-btn">+ 手动添加</button>
                    </div>
                </div>

                <!-- Parsed mutation list -->
                <div class="form-group">
                    <label>突变列表（可手动编辑或删除）：</label>
                    <div id="mutation-count" class="mutation-count">共 <strong>0</strong> 个突变体</div>
                    <div id="mutant-container" class="mutant-container">
                        <div style="color:#999;text-align:center;padding:20px;">请在上方输入突变并点击"批量解析"</div>
                    </div>
                </div>

                <!-- Output options -->
                <div class="form-group">
                    <label>输出方式：</label>
                    <div class="output-options">
                        <div class="output-option">
                            <input type="radio" id="output-separate" name="output-type" value="separate" checked>
                            <label for="output-separate">导出为独立文件（ZIP压缩包）</label>
                        </div>
                        <div class="output-option">
                            <input type="radio" id="output-combined" name="output-type" value="combined">
                            <label for="output-combined">合并为一个FASTA文件</label>
                        </div>
                    </div>
                </div>

                <!-- WT retention option -->
                <div class="form-group">
                    <div class="output-options">
                        <div class="output-option">
                            <input type="checkbox" id="include-wt" checked>
                            <label for="include-wt">包含野生型（WT）序列</label>
                        </div>
                    </div>
                </div>

                <button id="export-btn" class="export-btn">🚀 导出突变</button>
            </div>
        </div>

        <div class="right-panel">
            <div class="section">
                <div class="section-title-small">日志</div>
                <div id="info-box" class="info-box">
                    <div class="log-entry">欢迎使用基因模拟突变工具！</div>
                    <div class="log-entry">📋 粘贴序列或上传文件 → 选择基因 → 批量输入突变 → 导出</div>
                </div>
            </div>
        </div>
    </div>

    <div class="status-bar" id="status-bar">
        江南大学 粮食发酵工艺与技术国家工程实验室
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // ── Global state ──
            let genes = {};
            let selectedGene = null;
            let mutationMode = 'single'; // 'single' | 'combo'

            // ── DOM refs ──
            const fastaFileInput = document.getElementById('fasta-file');
            const seqTextarea = document.getElementById('seq-textarea');
            const geneList = document.getElementById('gene-list');
            const mutantContainer = document.getElementById('mutant-container');
            const mutationCountEl = document.getElementById('mutation-count');
            const batchMutations = document.getElementById('batch-mutations');
            const addMutantBtn = document.getElementById('add-mutant-btn');
            const exportBtn = document.getElementById('export-btn');
            const infoBox = document.getElementById('info-box');
            const statusBar = document.getElementById('status-bar');

            // ── Tab switching ──
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                    this.classList.add('active');
                    document.getElementById(this.dataset.tab).classList.add('active');
                });
            });

            // ── Mode toggle ──
            document.querySelectorAll('.mode-option').forEach(opt => {
                opt.addEventListener('click', function() {
                    document.querySelectorAll('.mode-option').forEach(o => o.classList.remove('active'));
                    this.classList.add('active');
                    mutationMode = this.querySelector('input').value;
                    updateBatchPlaceholder();
                    logMessage(`切换为：${mutationMode === 'single' ? '单点突变模式（每个突变独立）' : '组合突变模式（同组突变同时作用）'}`);
                });
            });

            function updateBatchPlaceholder() {
                if (mutationMode === 'single') {
                    batchMutations.placeholder =
                        '单点突变模式：所有突变用空格/换行分隔，每个独立生成一条序列\n' +
                        '例如：G514N G514S D518W D518P I519E I519P';
                } else {
                    batchMutations.placeholder =
                        '组合突变模式：每行一组突变，自动识别单点/组合\n' +
                        '仅1个突变 → 单点突变 | 多个突变（空格分隔）→ 组合突变\n' +
                        '例如：G514N D518W\n     I519E Y520T\n     G514N（自动识别为单点）';
                }
            }

            // ── Parse sequence from textarea ──
            document.getElementById('btn-parse-seq').addEventListener('click', function() {
                const text = seqTextarea.value.trim();
                if (!text) {
                    alert('请先粘贴序列文本！');
                    return;
                }
                const seqName = document.getElementById('seq-name').value.trim() || 'WT';
                parseSequenceText(text, seqName);
            });

            // ── File upload ──
            fastaFileInput.addEventListener('change', function(event) {
                const files = event.target.files;
                if (!files || files.length === 0) return;

                genes = {};
                geneList.innerHTML = '';
                logMessage(`已选择 ${files.length} 个文件`);

                Array.from(files).forEach(file => {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        parseSequenceText(e.target.result, file.name);
                    };
                    reader.readAsText(file);
                });
            });

            // ── Universal sequence parser (handles FASTA, raw, numbered, any format) ──
            function parseSequenceText(text, sourceName) {
                // Detect format: if contains '>' at line starts, treat as FASTA
                const hasFastaHeaders = /^>\s*\S+/m.test(text);

                if (hasFastaHeaders) {
                    parseFasta(text, sourceName);
                } else {
                    // Raw sequence: strip numbers, spaces, punctuation, keep only letters
                    const cleaned = text.replace(/[\d\s\t\n\r,;.:()（）\-_/\\|@#$%^&*+=<>[\]]/g, '').toUpperCase();

                    if (cleaned.length === 0) {
                        logMessage(`⚠️ 未从 "${sourceName}" 中识别到有效氨基酸序列`);
                        return;
                    }

                    // Validate it looks like amino acids (standard 20 + ambiguous)
                    const validAAs = /^[ACDEFGHIKLMNPQRSTVWY]+$/i;
                    const nonAA = cleaned.replace(/[ACDEFGHIKLMNPQRSTVWY]/gi, '');
                    if (nonAA.length > cleaned.length * 0.3) {
                        logMessage(`⚠️ "${sourceName}" 中非氨基酸字符过多 (${nonAA.length}/${cleaned.length})，可能不是蛋白质序列`);
                    }

                    // Create a gene entry from the filename or a default name
                    const geneName = sourceName.replace(/\.[^.]+$/, '') || 'UnnamedSequence';
                    const uniqueName = makeUniqueGeneName(geneName);
                    genes[uniqueName] = cleaned;
                    addGeneToList(uniqueName);
                    logMessage(`✅ 解析 "${sourceName}" → 基因 "${uniqueName}"，${cleaned.length} aa`);
                    updateStatus(`已加载基因: ${uniqueName} (${cleaned.length} aa)`);
                }
            }

            function makeUniqueGeneName(baseName) {
                if (!genes[baseName]) return baseName;
                let i = 2;
                while (genes[baseName + '_' + i]) i++;
                return baseName + '_' + i;
            }

            // ── FASTA parser ──
            function parseFasta(content, filename) {
                const lines = content.split('\n');
                let currentId = '';
                let currentSeq = '';
                let count = 0;

                for (let line of lines) {
                    line = line.trim();
                    if (line.startsWith('>')) {
                        if (currentId && currentSeq) {
                            // Clean sequence: remove anything that's not a letter
                            const cleaned = currentSeq.replace(/[^A-Za-z]/g, '').toUpperCase();
                            if (cleaned.length > 0) {
                                genes[currentId] = cleaned;
                                addGeneToList(currentId);
                                count++;
                            }
                        }
                        currentId = line.substring(1).split(/\s+/)[0];
                        currentSeq = '';
                    } else if (line) {
                        currentSeq += line;
                    }
                }

                // Last entry
                if (currentId && currentSeq) {
                    const cleaned = currentSeq.replace(/[^A-Za-z]/g, '').toUpperCase();
                    if (cleaned.length > 0) {
                        genes[currentId] = cleaned;
                        addGeneToList(currentId);
                        count++;
                    }
                }

                logMessage(`✅ 解析 "${filename}" → ${count} 个基因`);
                updateStatus(`已加载 ${Object.keys(genes).length} 个基因`);
            }

            // ── Gene list UI ──
            function addGeneToList(geneId) {
                // Remove placeholder if present
                const placeholder = geneList.querySelector('.gene-item:not([data-gene])');
                if (placeholder && !geneList.querySelector('[data-gene]')) {
                    geneList.innerHTML = '';
                }

                const geneItem = document.createElement('div');
                geneItem.className = 'gene-item';
                geneItem.setAttribute('data-gene', geneId);
                geneItem.textContent = `${geneId} (${genes[geneId].length} aa)`;
                geneItem.addEventListener('click', function() {
                    document.querySelectorAll('.gene-item.selected').forEach(item => item.classList.remove('selected'));
                    this.classList.add('selected');
                    selectedGene = geneId;
                    logMessage(`选中基因: ${geneId}`);
                    logMessage(`序列长度: ${genes[geneId].length} aa`);
                    logMessage(`N端: ${genes[geneId].substring(0, 60)}...`);
                });
                geneList.appendChild(geneItem);
            }

            // ── Batch parse mutations ──
            document.getElementById('btn-parse-mutations').addEventListener('click', function() {
                const text = batchMutations.value.trim();
                if (!text) {
                    alert('请先在文本框中输入突变！');
                    return;
                }
                parseBatchMutations(text);
            });

            // ── Clear all mutations ──
            document.getElementById('btn-clear-mutations').addEventListener('click', function() {
                mutantContainer.innerHTML = '<div style="color:#999;text-align:center;padding:20px;">请在上方输入突变并点击"批量解析"</div>';
                updateMutationCount();
                logMessage('已清空突变列表');
            });

            function parseBatchMutations(text) {
                const mutationPattern = /^[A-Za-z]\d+[A-Za-z]$/;

                if (mutationMode === 'single') {
                    // Single-point mode: split by any whitespace, each token = one mutant
                    const tokens = text.split(/[\s,;，；]+/).filter(t => t.length > 0);
                    const validMutations = [];
                    const invalidTokens = [];
                    const seen = new Set();

                    for (let token of tokens) {
                        const t = token.trim();
                        if (!mutationPattern.test(t)) {
                            invalidTokens.push(t);
                            continue;
                        }
                        // Deduplicate
                        const upper = t.toUpperCase();
                        if (seen.has(upper)) continue;
                        seen.add(upper);
                        validMutations.push(upper);
                    }

                    if (invalidTokens.length > 0) {
                        logMessage(`⚠️ 忽略 ${invalidTokens.length} 个格式不正确的项: ${invalidTokens.slice(0, 10).join(', ')}${invalidTokens.length > 10 ? '...' : ''}`);
                    }

                    if (validMutations.length === 0) {
                        alert('未识别到有效突变！格式应为：原氨基酸+位置+新氨基酸（如 G514N）');
                        return;
                    }

                    // Clear existing and populate
                    mutantContainer.innerHTML = '';
                    validMutations.forEach(mut => addMutationEntry(mut, 'single'));
                    logMessage(`✅ 批量解析完成：${validMutations.length} 个单点突变（已自动去重）`);

                } else {
                    // Combo mode: each line = one mutant (auto-detect single vs combo)
                    const lines = text.split(/[\n\r]+/).filter(l => l.trim().length > 0);
                    const entries = [];
                    const invalidLines = [];
                    let singleCount = 0;
                    let comboCount = 0;

                    for (let line of lines) {
                        const tokens = line.split(/[\s,;，；]+/).filter(t => t.length > 0);
                        const validTokens = tokens.filter(t => mutationPattern.test(t));
                        if (validTokens.length === 0) {
                            invalidLines.push(line.trim());
                            continue;
                        }
                        if (validTokens.length !== tokens.length) {
                            const bad = tokens.filter(t => !mutationPattern.test(t));
                            logMessage(`⚠️ 行中忽略格式错误: ${bad.join(', ')}`);
                        }
                        const normalized = validTokens.map(t => t.toUpperCase()).join(' ');
                        // Auto-detect: 1 mutation → single, 2+ → combo
                        const entryType = validTokens.length === 1 ? 'single' : 'combo';
                        if (entryType === 'single') singleCount++;
                        else comboCount++;
                        entries.push({ mutations: normalized, type: entryType });
                    }

                    if (entries.length === 0) {
                        alert('未识别到有效突变！每行至少需要一个有效突变（如 G514N 或 G514N D518W）');
                        return;
                    }

                    mutantContainer.innerHTML = '';
                    entries.forEach(e => addMutationEntry(e.mutations, e.type));
                    const parts = [];
                    if (singleCount > 0) parts.push(`${singleCount} 个单点突变`);
                    if (comboCount > 0) parts.push(`${comboCount} 个组合突变`);
                    logMessage(`✅ 批量解析完成：${parts.join(' + ')}（自动识别）`);
                }

                updateMutationCount();
            }

            // ── Add single mutation entry to the list ──
            function addMutationEntry(mutationStr, type) {
                // Remove empty placeholder
                const placeholder = mutantContainer.querySelector('div[style]');
                if (placeholder && !mutantContainer.querySelector('.mutant-input')) {
                    mutantContainer.innerHTML = '';
                }

                const div = document.createElement('div');
                div.className = 'mutant-input';

                const badge = document.createElement('span');
                badge.className = 'mutant-type-badge ' + (type === 'single' ? 'badge-single' : 'badge-combo');
                badge.textContent = type === 'single' ? '单点' : '组合';

                const input = document.createElement('input');
                input.type = 'text';
                input.className = 'mutation-input';
                input.value = mutationStr;
                input.setAttribute('data-type', type);
                input.placeholder = type === 'single' ? '例如: G514N' : '例如: G514N D518W';

                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'delete-btn';
                deleteBtn.textContent = '删除';
                deleteBtn.addEventListener('click', function() {
                    mutantContainer.removeChild(div);
                    updateMutationCount();
                    if (mutantContainer.querySelectorAll('.mutant-input').length === 0) {
                        mutantContainer.innerHTML = '<div style="color:#999;text-align:center;padding:20px;">请在上方输入突变并点击"批量解析"</div>';
                    }
                });

                div.appendChild(badge);
                div.appendChild(input);
                div.appendChild(deleteBtn);
                mutantContainer.appendChild(div);
            }

            // ── Manual add mutation ──
            addMutantBtn.addEventListener('click', function() {
                const placeholder = mutantContainer.querySelector('div[style]');
                if (placeholder) mutantContainer.innerHTML = '';
                addMutationEntry('', mutationMode);
                updateMutationCount();
            });

            function updateMutationCount() {
                const count = mutantContainer.querySelectorAll('.mutant-input').length;
                mutationCountEl.innerHTML = `共 <strong>${count}</strong> 个突变体`;
            }

            // ── Export mutations ──
            exportBtn.addEventListener('click', async function() {
                if (!selectedGene) {
                    alert('请先选择一个基因！');
                    return;
                }

                const originalSeq = genes[selectedGene];
                const outputType = document.querySelector('input[name="output-type"]:checked').value;
                const includeWT = document.getElementById('include-wt').checked;

                // Collect mutations
                const mutationsToApply = [];
                const mutantInputs = mutantContainer.querySelectorAll('.mutation-input');

                for (let input of mutantInputs) {
                    const mutationStr = input.value.trim();
                    if (!mutationStr) continue;

                    const type = input.getAttribute('data-type') || 'single';

                    // Validate
                    const valid = validateMutations(mutationStr, originalSeq.length);
                    if (!valid) {
                        alert(`突变格式错误: "${mutationStr}"。应类似 A1S（单点）或 A1S B2T（组合，空格分隔）`);
                        return;
                    }

                    const mutantName = mutationStr.replace(/\s+/g, '-');
                    mutationsToApply.push({
                        name: mutantName,
                        mutations: mutationStr,
                        type: type
                    });
                }

                if (mutationsToApply.length === 0 && !includeWT) {
                    alert('请输入至少一个有效的突变，或勾选"包含野生型（WT）序列"！');
                    return;
                }

                updateStatus('正在生成突变体文件...');

                const singleCount = mutationsToApply.filter(m => m.type === 'single').length;
                const comboCount = mutationsToApply.filter(m => m.type === 'combo').length;
                const wtInfo = includeWT ? ' + WT' : '';
                logMessage(`生成中: ${singleCount} 个单点突变 + ${comboCount} 个组合突变 = ${mutationsToApply.length} 个突变体${wtInfo}`);

                if (outputType === 'separate') {
                    try {
                        const zip = new JSZip();

                        // Include WT sequence if checkbox is checked
                        if (includeWT) {
                            const wtFileName = `${selectedGene}_WT.fasta`;
                            const wtContent = `>${selectedGene}_WT\n${formatSequence(originalSeq)}`;
                            zip.file(wtFileName, wtContent);
                        }

                        for (let mutant of mutationsToApply) {
                            try {
                                const mutatedSeq = applyMutation(originalSeq, mutant.mutations);
                                const fileName = `${selectedGene}_${mutant.name}.fasta`;
                                const fileContent = `>${selectedGene}_${mutant.name}\n${formatSequence(mutatedSeq)}`;
                                zip.file(fileName, fileContent);
                            } catch (e) {
                                alert(`应用突变 "${mutant.name}" 时出错: ${e.message}`);
                                return;
                            }
                        }

                        const totalFiles = (includeWT ? 1 : 0) + mutationsToApply.length;
                        zip.generateAsync({ type: "blob" }).then(function(content) {
                            downloadBlob(content, `${selectedGene}_mutations.zip`);
                            logMessage(`✅ 已导出压缩包: ${selectedGene}_mutations.zip (${totalFiles} 个文件${wtInfo})`);
                            updateStatus('突变已成功导出为ZIP文件！');
                        });
                    } catch (e) {
                        alert(`创建ZIP文件时出错: ${e.message}`);
                    }
                } else {
                    // Combined output
                    const records = [];

                    // Include WT sequence if checkbox is checked
                    if (includeWT) {
                        records.push({ id: `${selectedGene}_WT`, seq: originalSeq });
                    }

                    for (let mutant of mutationsToApply) {
                        try {
                            const mutatedSeq = applyMutation(originalSeq, mutant.mutations);
                            records.push({ id: `${selectedGene}_${mutant.name}`, seq: mutatedSeq });
                        } catch (e) {
                            alert(`应用突变 "${mutant.name}" 时出错: ${e.message}`);
                            return;
                        }
                    }

                    let combinedContent = '';
                    records.forEach(record => {
                        combinedContent += `>${record.id}\n${formatSequence(record.seq)}\n`;
                    });

                    downloadBlob(
                        new Blob([combinedContent], { type: 'text/plain' }),
                        `${selectedGene}_mutants.fasta`
                    );
                    logMessage(`✅ 已导出合并文件: ${selectedGene}_mutants.fasta (${records.length} 条序列${wtInfo})`);
                    updateStatus('突变已成功导出为合并文件！');
                }
            });

            // ── Validate mutation format ──
            function validateMutations(mutationStr, seqLength) {
                const mutations = mutationStr.split(/\s+/);
                const mutationPattern = /^[A-Za-z]\d+[A-Za-z]$/;

                for (let mut of mutations) {
                    if (!mutationPattern.test(mut)) return false;
                    const pos = parseInt(mut.slice(1, -1));
                    if (pos < 1 || pos > seqLength) return false;
                }
                return true;
            }

            // ── Apply mutations to sequence ──
            function applyMutation(sequence, mutationStr) {
                const mutations = mutationStr.split(/\s+/);
                const seqArray = sequence.split('');

                for (let mut of mutations) {
                    const originalAA = mut[0].toUpperCase();
                    const pos = parseInt(mut.slice(1, -1)) - 1;
                    const newAA = mut[mut.length - 1].toUpperCase();

                    if (seqArray[pos] !== originalAA) {
                        throw new Error(`位置 ${pos + 1} 的氨基酸是 ${seqArray[pos]}，不是 ${originalAA}`);
                    }
                    seqArray[pos] = newAA;
                }
                return seqArray.join('');
            }

            // ── Format sequence (60 chars per line) ──
            function formatSequence(seq) {
                const chunkSize = 60;
                let result = '';
                for (let i = 0; i < seq.length; i += chunkSize) {
                    result += seq.slice(i, i + chunkSize) + '\n';
                }
                return result;
            }

            // ── Download helpers ──
            function downloadBlob(blob, filename) {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }

            // ── Logging ──
            function logMessage(message) {
                const logEntry = document.createElement('div');
                logEntry.className = 'log-entry';
                logEntry.textContent = message;
                infoBox.appendChild(logEntry);
                infoBox.scrollTop = infoBox.scrollHeight;
            }

            function updateStatus(message) {
                statusBar.textContent = message;
            }

            // ── Init ──
            updateBatchPlaceholder();
            logMessage('准备就绪。');
            logMessage('💡 新功能：默认序列命名（WT）+ 可选保留野生型序列 + 粘贴任意格式序列 + 批量导入突变 + 单点/组合模式切换');
        });
    </script>
    <script src="bat-ai-assistant.js"></script>
</body>
</html>
